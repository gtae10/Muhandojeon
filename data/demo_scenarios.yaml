# 데모 시나리오 3종 — 발표에서 그대로 재생하는 고정 시나리오.
#
# 같은 시나리오를 돌리면 항상 같은 흐름이 나와야 한다. 그래서
#   - 고객·상품·세션을 픽스처 id 로 못박고 (자동 선택 금지)
#   - LLM 은 temperature 0 + 시드 고정 + 디스크 캐시(DEMO_MODE=true)
#   - 컨디션은 픽스처 고정값, 시간 기준은 REFERENCE_NOW 고정
# expect 블록은 `make demo-check`(scripts/check_demo.py)가 검증한다. 여기가 깨지면
# 발표 대본이 깨진 것이므로 데모 전에 반드시 통과시킨다.

scenarios:
  - id: D1
    title: 사이즈 불확실 — 같은 라스트 보유 고객
    narrative: |
      사이즈표를 세 번 열고 38.5와 39를 왕복한 뒤 이탈한 고객(CU-0003).
      같은 LAST-AURELIA 신발(AS-0010)을 이미 갖고 있어 "그때 맞춰 드린 치수"를 근거로 쓴다.
    customer_id: CU-0003
    target_product_id: LX-0006
    session_id: SC-SIZE
    strategy_id: S2
    talking_points:
      - 세션 이벤트에서 size_guide 3회가 잡힌다(AI1 라벨 SIZE_UNCERTAIN, 신뢰도 0.95)
      - 상담 문구가 보유 개체(AS-0010)의 구매 연도와 컨디션 81점을 인용한다
      - 같은 last_code 라 치수를 그대로 적용할 수 있다는 것이 근거
    expect:
      hesitation_type: SIZE_UNCERTAIN
      owned_assets_used: true
      min_citations: 1
      cta_in: [BOOK_FITTING, CARE_BOOKING]

  - id: D2
    title: 가격 망설임 — 보유 자산의 수명으로 답한다
    narrative: |
      가격 상한을 400만원으로 내리고 저가 대안을 두 번 조회한 뒤 장바구니에서 뺀 고객(CU-0004).
      할인 대신 "N년 쓴 개체가 아직 몇 점"이라는 실제 컨디션 기록으로 답한다.
    customer_id: CU-0004
    target_product_id: LX-0001
    session_id: SC-PRICE
    strategy_id: S2
    talking_points:
      - 가격 필터 하향 + 저가 대안 2회 조회가 신호로 잡힌다(AI1 라벨 PRICE_HESITANT)
      - 상담 문구가 보유 개체의 사용 연수와 현재 컨디션을 인용한다
      - 할인 없이 근거로 설득한다는 점이 차별점
    expect:
      hesitation_type: PRICE_HESITANT
      owned_assets_used: true
      min_citations: 1
      cta_in: [BOOK_FITTING, CARE_BOOKING, VIEW_STOCK]

  - id: D3
    title: 재고 확인 — 케어 시점이 임박한 VIP
    narrative: |
      30cm 재고와 배송을 확인하고 품절인 35cm까지 다시 조회한 장기 VIP(CU-0001).
      컨디션 71점(핸들 마모 임계 근접) 개체가 있어 재고 안내와 케어 예약을 함께 제안한다.
      발표 대본의 핵심 대사가 나오는 시나리오다.
    customer_id: CU-0001
    target_product_id: LX-0002
    session_id: SC-STOCK
    strategy_id: S2
    talking_points:
      - 재고 조회 2회 + 배송 조회가 신호로 잡힌다(AI1 라벨 STOCK_CONCERN)
      - 컨디션 71점 / 케어 1개월 이내 개체(AS-0001)를 인용한다
      - CTA 는 케어 예약 — 소유 자산 없이는 나올 수 없는 제안
    expect:
      hesitation_type: STOCK_CONCERN
      owned_assets_used: true
      min_citations: 1
      cta_in: [CARE_BOOKING, VIEW_STOCK]
      must_include_asset_condition: 71
