# /etc/nginx/conf.d/muhandojeon.conf
# Rocky nginx는 sites-available/sites-enabled 구조가 없다 — conf.d/*.conf가 곧바로 include된다.
# 프론트는 정적 파일로 루트에서 서빙, API 경로는 app/(:8000, 통합 레이어)로 리버스 프록시.
# backend(:8103)와 ai-clienteling(:8102)는 app/의 HTTP 어댑터가 내부적으로만 호출한다 —
# 외부에는 이 nginx 블록을 통해 노출되지 않는다(firewalld로도 직접 접근을 막는다).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /opt/muhandojeon/main/frontend/dist;
    index index.html;

    # 통합 레이어(app/, :8000)로 리버스 프록시하는 경로들.
    # vite.config.js의 dev 프록시 목록 + 발표 점검용 대시보드(/lab, /ops) + FastAPI 문서.
    # (/|$)로 "정확히 이 경로 또는 그 하위 경로"만 매칭 — 없으면 static-files처럼
    # static/assets로 시작하는 정적 파일명까지 API 프록시로 잘못 가로채진다.
    location ~ ^/(session|catalog|customers|sessions|demo|health|static|lab|ops|intent|clienteling|assets|condition|fingerprint|docs|openapi\.json|redoc)(/|$) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Lab 진행률 SSE 스트림용
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # React SPA — 나머지는 전부 index.html로 (클라이언트 라우팅)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
