# /etc/nginx/nginx.conf
# Rocky의 nginx RPM 기본 nginx.conf에는 http{} 안에 default_server 블록이 내장돼 있어서,
# conf.d/muhandojeon.conf의 default_server와 충돌한다("duplicate default server" 에러).
# 그래서 기본 server{} 블록을 빼고 conf.d/*.conf만 include하는 형태로 이 파일 전체를 교체한다.
# (원본은 06_nginx_install.sh가 /etc/nginx/nginx.conf.orig로 백업해둔다.)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65;
    types_hash_max_size   4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # 실제 서버 블록은 여기서 전부 온다 — muhandojeon.conf 하나뿐이다.
    include /etc/nginx/conf.d/*.conf;
}
