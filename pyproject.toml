[project]
name = "luxe-clienteling"
version = "0.1.0"
description = "럭셔리 개체지문 + AI 클라이언텔링 — 통합/데모 레이어"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "polars>=1.30",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "tenacity>=8.4",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "contracts"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 생성 산출물은 포맷 대상이 아니다. (exports/README.md 의 코드 블록을 ruff format 이 손대면
# 다음 `make data` 에서 되돌아가 `make check` 가 영구 실패한다)
extend-exclude = ["exports", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# 문서 생성기는 마크다운 표를 문자열로 품고 있어 줄바꿈하면 출력이 깨진다.
"scripts/gen_provenance_doc.py" = ["E501"]
"scripts/export_for_team.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 편집 설치(.pth)가 환경에 따라 sys.path 에 안 잡히는 경우가 있어 명시한다.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
