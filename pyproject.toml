[project]
name = "luxe-clienteling"
version = "0.1.0"
description = "럭셔리 개체지문 + AI 클라이언텔링 — 통합/데모 레이어"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "polars>=1.30",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "tenacity>=8.4",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "numpy>=1.26",
    "jinja2>=3.1",
    # A: 고전 CV 컨디션 진단 (비전 API 없이 독립 동작)
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    # A-6: RAG 기본 경로 (임베딩 API 의존 제거)
    "rank-bm25>=0.2.2",
]



[project.optional-dependencies]
# A-6: 개체 지문 임베딩(로컬 DINOv2). 대회 API 와 무관하다.
# 없으면 고전 기술자(ORB/LBP 히스토그램)로 동작하므로 필수는 아니다.
fingerprint = ["torch>=2.2", "timm>=1.0"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "contracts"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 보류 코드와 데이터 산출물은 검사 대상이 아니다.
#  - scripts/_deferred: 데이터셋 확정 전까지 실행 경로에서 분리한 코드(현재 앱 구조와 어긋날 수 있다)
#  - data: 생성 산출물. 마크다운 안의 코드 블록을 ruff format 이 손대면 재생성 때 되돌아간다
extend-exclude = ["scripts/_deferred", "data", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# 문서 생성기는 마크다운 표를 문자열로 품고 있어 줄바꿈하면 출력이 깨진다.
"scripts/gen_provenance_doc.py" = ["E501"]
"scripts/export_for_team.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

exclude = ["^scripts/_deferred/"]

[[tool.mypy.overrides]]
module = ["scripts._deferred.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# 편집 설치(.pth)가 환경에 따라 sys.path 에 안 잡히는 경우가 있어 명시한다.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
